name: Code Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
      
      - name: Install dependencies
        run: |
          cpanm --notest --installdeps .
          cpanm --notest Devel::Cover Devel::Cover::Report::Coveralls
      
      - name: Run tests with coverage
        run: |
          cover -test -ignore_re '^t/'
      
      - name: Generate coverage report
        run: |
          cover -report html
      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: cover_db/
      
      - name: Display coverage summary
        run: |
          cover -report text
      
      - name: Check coverage thresholds
        run: |
          # Extract coverage percentage
          COVERAGE=$(cover -report text | grep -oP 'Total\s+\d+\.\d+' | grep -oP '\d+\.\d+' || echo "0")
          echo "Coverage: $COVERAGE%"
          
          # Check if coverage meets minimum threshold (60% for now, increase later)
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "⚠️  Coverage is below 60% threshold"
            exit 1
          fi
          
          echo "✅ Coverage meets minimum threshold"
      
      - name: Coverage badge
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          COVERAGE=$(cover -report text | grep -oP 'Total\s+\d+\.\d+' | grep -oP '\d+\.\d+' || echo "0")
          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          fi
          echo "Coverage: $COVERAGE% ($COLOR)"